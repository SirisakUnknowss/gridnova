name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      function:
        description: Reviewed production function to deploy after release approval
        type: choice
        required: true
        options:
          - equip-item
          - purchase-item

jobs:
  deploy:
    # Database promotion is reviewed separately; staging scheduler code must never deploy with main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy reviewed Edge Function
        shell: bash
        run: |
          test "$PROJECT_REF" = "sqjllqilozhxbzvfjhra" || { echo "Unexpected production project"; exit 1; }
          case "$FUNCTION_NAME" in
            equip-item|purchase-item) ;;
            *) echo "Function is outside the reviewed release scope"; exit 1 ;;
          esac
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF"
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          FUNCTION_NAME: ${{ inputs.function }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
