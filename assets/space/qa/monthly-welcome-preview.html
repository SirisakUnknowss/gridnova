<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly launch preview</title></head><body><label class="theme-qa-picker">Server date <select aria-label="Server date"><option>2026-10-31</option><option>2026-11-01</option><option>2026-12-01</option><option>2027-01-01</option></select></label><label class="theme-qa-picker">Theme <select aria-label="Theme"><option value="theme_moonlit_river">Light</option><option value="theme_river_of_stars">Dark</option></select></label><button class="btn" id="preview-welcome">Preview monthly welcome</button><main id="theme-scene"></main><script type="module">
import '/src/ui/styles/main.css';
import {homeViewHTML} from '/src/ui/views/home.ts';
import {applyTheme} from '/src/lib/themes.ts';
import {launchedMonthly,currentMonthly} from '/src/lib/monthly-discovery.ts';
import {showMonthlyWelcome} from '/src/ui/views/monthly-welcome.ts';
const scene=document.querySelector('#theme-scene');scene.innerHTML=homeViewHTML();applyTheme('theme_moonlit_river');
document.querySelector('[aria-label=Theme]').addEventListener('change',event=>applyTheme(event.target.value));
const picker=document.querySelector('select');const preview=document.querySelector('#preview-welcome');
function update(){scene.querySelector('#open-monthly').hidden=!launchedMonthly(picker.value);preview.disabled=!currentMonthly(picker.value);}
picker.addEventListener('change',update);update();
preview.addEventListener('click',()=>showMonthlyWelcome(currentMonthly(picker.value),'qa-preview',()=>{scene.querySelector('#open-monthly').focus();scene.querySelector('#open-monthly').scrollIntoView({block:'center'});}));
</script></body></html>
