<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GridNova theme icon QA</title></head><body>
<label class="theme-qa-picker">Theme <select id="theme-picker" aria-label="Preview theme"></select></label><main id="theme-scene"></main>
<script type="module">
import '/src/ui/styles/main.css';
import { THEMES, applyTheme } from '/src/lib/themes.ts';
import { homeViewHTML } from '/src/ui/views/home.ts';
const scene = document.querySelector('#theme-scene');
const picker = document.querySelector('#theme-picker');
for (const theme of Object.values(THEMES)) picker.add(new Option(theme.name, theme.id));
scene.innerHTML = homeViewHTML();
scene.querySelector('.home-save-banner')?.remove();
const update = () => applyTheme(picker.value, scene);
picker.addEventListener('change', update);
update();
</script></body></html>
