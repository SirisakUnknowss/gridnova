<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy image readability preview</title></head><body>
<label class="theme-qa-picker">Artwork <select aria-label="Artwork version"><option value="new">Simplified fantasy</option><option value="old">Original detailed</option></select></label><main id="theme-scene" class="fantasy-image-qa"></main>
<script type="module">
import '/src/ui/styles/main.css';
import { applyTheme } from '/src/lib/themes.ts';
import { homeViewHTML } from '/src/ui/views/home.ts';
const scene=document.querySelector('#theme-scene');
scene.style.setProperty('--preview-icon-atlas', "url('/assets/space/theme-icons/readable-moonlit-v1.webp')");
scene.innerHTML=homeViewHTML();
scene.querySelector('.home-save-banner')?.remove();
applyTheme('theme_moonlit_river',scene);
const positions={home:'0% 0%',medals:'50% 0%',shop:'100% 0%',profile:'0% 50%',daily:'50% 50%',practice:'100% 50%',mode:'0% 100%',quests:'50% 100%',clock:'100% 100%'};
for(const [role,pos] of Object.entries(positions)) for(const el of scene.querySelectorAll('.theme-icon--'+role)){el.replaceChildren(Object.assign(document.createElement('span'),{className:'theme-icon-picture'}));el.style.setProperty('--skin-position',pos);}
const update=()=>scene.dataset.artwork=document.querySelector('select').value;
document.querySelector('select').addEventListener('change',update);update();
</script></body></html>
